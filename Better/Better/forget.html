<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

   <!-- FORGET PASSWORD -->

    <div class="container px-5 bg-white mx-auto">
        <div class="row" style="max-height: 640px;">
            <div class="col-lg-6 d-none d-md-block" style="max-height: 660px; padding-top: 80px;">
                <div class="h-100 pt-5 border rounded-4" style="background: linear-gradient(to bottom, #BEBEBE, #FFFFFF, #BEBEBE);">
                    <h1 class="text-center" style="font-size: 24px; line-height: 28.8px; letter-spacing: 0%;">Welcome back!</h1>
                     <p class="fw-medium d-flex justify-content-center text-center text-secondary" style="font-size: 16px; line-height: 24px; color: #545454;">Log in to continue refining your betting strategy</p>
                    <div class="d-flex justify-content-center  overflow-hidden pb-5" style="padding-top: 100px;">
                        <img src="/Better/assest/image/Frame 86.png" class=""  alt="Fullscreen Image">
                    </div>
                    
                </div>
            </div>
            <div class="col-lg-6 d-flex justify-content-center" style="padding-top: 163px; padding-bottom : 100px; gap : 40px;">
                <div class="bg-white  rounded " style="max-width: 400px; width: 100%; text-align: center;">
                    <h2>Forgot Password</h2>
                    <form id="loginForm" class="pt-4 bg-white rounded " style="max-width: 400px; width: 100%; text-align: center; margin: auto;">
                        <div class="mb-3 text-start pb-4">
                            <label for="username" class="form-label fw-bold" style="color: #0E0E0E;">Email Address</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter registered email address" required>
                        </div>
                    
                        <button type="submit" class="btn w-100 text-white " style="background-color: #4a148c;padding : 16px;">Submit</button>
                    
                        <p class="mt-3">Already have an account? <a href="#" class="fw-bold text-primary">Log In</a></p>
                    </form>
                </div>
            </div>
            
        </div>

    </div>


</body>
</html>
