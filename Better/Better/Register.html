<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

    <!-- REGISTRATION -->

    <div class="container px-5 bg-white mx-auto">
        <div class="row" >
            <div class="col-lg-6 d-none d-md-block" style="max-height: 660px; padding-top: 80px;">
                <div class="h-100 pt-5 border rounded-4" style="background: linear-gradient(to bottom, #BEBEBE, #FFFFFF, #BEBEBE);">
                    <h1 class="text-center" style="font-size: 24px; line-height: 28.8px; letter-spacing: 0%;">Create Your BetterBettors Account</h1>
                     <p class="fw-medium d-flex justify-content-center text-center text-secondary" style="font-size: 16px; line-height: 24px; color: #545454;">Log in to continue refining your betting strategy</p>
                    <div class="d-flex justify-content-center  overflow-hidden pb-5" style="padding-top: 100px;">
                        <img src="/Better/assest/image/Frame 86.png" class=""  alt="Fullscreen Image">
                    </div>
                    
                </div>
            </div>
            <div class="col-lg-6 d-flex justify-content-center" style="padding-top: 100px; padding-bottom : 100px;">
                <div class="bg-white  rounded " style="max-width: 400px; width: 100%; text-align: center;">
                    <h2 class="text-center fw-bold">Register</h2>
                    <p class="text-center pt-3">Step 1 / 4 - Personal Information</p>
            
                    <form>
                        <div class="mb-3 text-start pt-3">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" class="form-control" placeholder="Enter your firstname" required>
                        </div>
            
                        <div class="mb-3 text-start ">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" class="form-control" placeholder="Enter your Lastname" required>
                        </div>
            
                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold">Date of Birth</label>
                            <input type="date" class="form-control" required>
                        </div>
            
                        <div class="mb-3 text-start ">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" placeholder="Enter your phone number" required>
                        </div>
            
                        <div class="row pt-4" style="padding-left: 50px; gap : 10px;">
                            <button type="button" class="col-5 btn btn-outline-secondary" style="padding : 16px;">Cancel</button>
                            <button type="submit" class="col-5 btn text-white" style="background-color: #370061; padding : 16px;">Next</button>
                        </div>
                    </form>
            
                    <p class="mt-3 text-center">Already have an account? <a href="/Better/Login.html" class="text-decoration-none text-primary fw-bold">Log In</a></p>
            
                </div>
            </div>
            
        </div>

    </div>


</body>
</html>
